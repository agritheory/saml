name: Tests

on:
  push:
    branches:
      - version-15
      - version-16
  pull_request:

permissions:
  contents: write
  checks: write
  issues: write
  pull-requests: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  tests:
    name: Server (${{ matrix.db }})
    runs-on: ubuntu-latest

    concurrency:
      group: version-16-saml-${{ github.event.number || github.run_id }}-${{ matrix.db }}
      cancel-in-progress: true

    strategy:
      fail-fast: false
      matrix:
        db: [mariadb, postgres]

    services:
      mariadb:
        image: mariadb:10.6
        env:
          MYSQL_ALLOW_EMPTY_PASSWORD: YES
          MYSQL_ROOT_PASSWORD: admin
        ports:
          - 3306:3306
        options: --health-cmd="mysqladmin ping" --health-interval=5s --health-timeout=2s --health-retries=3

      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: admin
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Clone
        uses: actions/checkout@v4

      - name: Start Keycloak
        run: |
          docker run -d --name keycloak \
            -p 8080:8080 \
            -e KEYCLOAK_ADMIN=admin \
            -e KEYCLOAK_ADMIN_PASSWORD=admin \
            -e KC_HEALTH_ENABLED=true \
            quay.io/keycloak/keycloak:24.0.1 \
            start-dev
          for attempt in $(seq 1 60); do
            if curl -sf http://localhost:8080/health/ready >/dev/null; then
              echo "Keycloak is ready"
              exit 0
            fi
            sleep 2
          done
          echo "Keycloak failed to become ready" >&2
          docker logs keycloak
          exit 1

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'

      - name: Add to Hosts
        run: echo "127.0.0.1 test_site" | sudo tee -a /etc/hosts

      - name: Install Poetry
        uses: abatilo/actions-poetry@v4

      - name: Cache Poetry
        uses: actions/cache@v4
        with:
          path: ./.venv
          key: venv-${{ hashFiles('poetry.lock') }}

      - name: Install App Dependencies
        run: bash ${{ github.workspace }}/.github/helper/install_dependencies.sh

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          check-latest: true

      - name: Enable Corepack
        run: corepack enable

      - name: Install Bench Site and Apps
        env:
          DB: ${{ matrix.db }}
          MYSQL_HOST: localhost
          MYSQL_PWD: admin
          PGPASSWORD: admin
        run: bash ${{ github.workspace }}/.github/helper/install.sh

      - name: Sync Keycloak test realm
        working-directory: /home/runner/frappe-bench
        run: bench --site test_site execute 'saml.tests.setup.sync_keycloak_realm'

      - name: Run Frappe Tests
        working-directory: /home/runner/frappe-bench
        run: |
          bench --site test_site set-config allow_tests true
          bench --site test_site run-tests --app saml

      - name: Run Pytest Tests
        working-directory: /home/runner/frappe-bench
        run: |
          source env/bin/activate
          pip install pytest-cov pytest-order requests
          cd apps/saml
          pytest saml/tests \
            --cov=saml \
            --cov-report=xml:coverage.xml \
            --cov-report=term-missing \
            --disable-warnings -s 2>&1 | tee pytest-coverage.txt
          python - <<'PY'
          import sys
          import xml.etree.ElementTree as ET

          rate = float(ET.parse("coverage.xml").getroot().get("line-rate", "0"))
          print(f"Coverage line-rate: {rate:.1%}")
          if rate <= 0:
              sys.exit("Coverage report shows 0% — pytest did not measure executed code")
          PY
        env:
          TYPE: server
          DB: ${{ matrix.db }}

      - name: Pytest coverage comment
        if: matrix.db == 'mariadb'
        uses: MishaKav/pytest-coverage-comment@v1
        with:
          pytest-coverage-path: /home/runner/frappe-bench/apps/saml/pytest-coverage.txt
          pytest-xml-coverage-path: /home/runner/frappe-bench/apps/saml/coverage.xml
